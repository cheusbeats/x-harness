# paths.conf — единая классификация путей репозитория (PLAN-145, T15).
# Читают paths.py -> commit-gate.sh, branch-guard.sh, registry-guard.sh (merge-gate — этап 2b/3).
# Формат: `<вид> <значение>  # причина`. Маски (fnmatch) сверяются с ПЕРВЫМ сегментом пути.
#
#   code          правится только на feature/PLAN-<N>-* и hotfix/* (E2)
#   planning      реестры; правится на любой feature/hotfix, RM-токен права на код не даёт
#   exempt        исключение с причиной: класс «не код»
#   planning-root что допустимо прямо в корне planning/ (E9)
#   guard         файл planning/<имя>, правка которого через Edit/Write блокируется (E6)
#   guard-stage4  то же, но включается САМО, когда есть новая структура реестра (paths.py STAGE4_READY:
#                 plans/closed/ для PLANS.md и ACTIVE_PLANS.md, hotfixes/ для HOTFIXES.md и JOURNAL.md);
#                 пока её нет, registry.sh не умеет менять эти файлы и защита не включается
#
# Новый корневой элемент репозитория без строки здесь — fail-closed: commit-gate блокирует коммит.

code .agents
code .ai
code .cicd
code .cline
code .claude
code .codex
code .githooks
code .github
code .gitlab-ci.yml
code .mcp.json
