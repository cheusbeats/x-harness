planning planning

planning-root ROADMAP.md
planning-root ACTIVE_PLANS.md
planning-root PLANS.md
planning-root HOTFIXES.md
planning-root README.md
planning-root plans
planning-root roadmap
planning-root hotfixes

guard ROADMAP.md
guard-stage4 PLANS.md
guard-stage4 ACTIVE_PLANS.md
guard-stage4 HOTFIXES.md
guard-stage4 JOURNAL.md

# E18: правка защищённых путей (хуки, настройки, инструкции агента) — только под маркером владельца
# `owner-ok.sh hooks-edit <ветка>` (commit-gate, pre-commit, merge-gate). Значение: префикс каталога (с `/` на конце)
# или точный путь. Отдельный вид, а не `guard`: `guard` — имена файлов planning/ (E6).
# Переключатель `e18 on|off`. Читается из версии paths.conf в HEAD / merge-base, поэтому выключить правило той же
# правкой, которую оно должно остановить, нельзя.
e18 on
guard-e18 .claude/hooks/
guard-e18 .claude/settings.json
guard-e18 .claude/scripts/
guard-e18 .codex/
guard-e18 .agents/
guard-e18 .githooks/
guard-e18 CLAUDE.md
guard-e18 AGENTS.md
